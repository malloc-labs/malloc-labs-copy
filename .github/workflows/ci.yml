name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install pinned linters
        # Versions match .pre-commit-config.yaml so CI and pre-commit
        # agree about what "passes lint" means.
        run: pip install ruff==0.14.10 black==26.1.0

      - name: ruff
        run: ruff check src tests

      - name: black --check
        run: black --check src tests

      - name: pytest
        run: pytest
