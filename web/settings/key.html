<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy 653 — Key Exercises</title>
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/copy-653.css">
    <link rel="stylesheet" href="../css/key-page.css">
    <link rel="stylesheet" href="../css/settings.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="../js/theme.js"></script>
    <script src="../js/landing-keybinds.js" defer></script>
</head>
<body class="landing-body settings-review-body">
    <copy-theme-btn></copy-theme-btn>
    <main class="landing-shell">
        <copy-landing-header eyebrow="Settings" eyebrow-href="index.html" eyebrow-key="S" title="Key Exercises"></copy-landing-header>

        <section class="settings-panel settings-review-panel"
                 id="settings-panel-key">
            <section class="settings-koch-rollup" id="settings-key-rollup" hidden>
                <h3 class="settings-koch-rollup__heading">
                    Recent send evidence
                    <span class="settings-koch-rollup__meta" id="settings-key-rollup-meta"></span>
                    <button type="button"
                            class="settings-koch-rollup__history-link"
                            id="settings-key-history-link"
                            hidden>Full history →</button>
                </h3>
                <table class="settings-koch-rollup__table">
                    <thead>
                        <tr>
                            <th scope="col">Band</th>
                            <th scope="col">Recent fractions</th>
                            <th scope="col">Metrics</th>
                            <th scope="col">Strong</th>
                            <th scope="col">Low</th>
                        </tr>
                    </thead>
                    <tbody id="settings-key-rollup-tbody"></tbody>
                </table>
            </section>
            <div class="settings-records-meta">
                <p class="settings-koch-meta" id="settings-key-meta">Loading saved send sessions…</p>
                <div class="settings-records-meta__actions">
                    <button type="button"
                            class="btn settings-calendar-btn"
                            data-calendar-open="settings-key-calendar-dialog">Calendar</button>
                    <button type="button"
                            class="btn settings-backup-btn"
                            id="settings-key-backup"
                            data-kind="cadence-send">Back up</button>
                </div>
            </div>
            <div class="settings-koch-table-wrap">
                <table class="settings-koch-table">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Date &amp; time</th>
                            <th scope="col">Claimed symbols</th>
                            <th scope="col">Exercises</th>
                            <th scope="col">Delete</th>
                        </tr>
                    </thead>
                    <tbody id="settings-key-tbody"></tbody>
                </table>
            </div>
            <dialog class="settings-koch-dialog settings-calendar-dialog"
                    id="settings-key-calendar-dialog">
                <form method="dialog" class="settings-koch-dialog__bar">
                    <h2 class="settings-koch-dialog__title">Send practice calendar</h2>
                    <button type="submit"
                            class="settings-koch-dialog__close"
                            aria-label="Close calendar">Close</button>
                </form>
                <div class="settings-koch-dialog__body">
                    <div class="settings-calendar" id="settings-key-calendar">
                        <div class="settings-calendar__header">
                            <button type="button"
                                    class="settings-calendar__nav"
                                    data-calendar-prev
                                    aria-label="Previous month">&larr;</button>
                            <h3 class="settings-calendar__title" data-calendar-title>&nbsp;</h3>
                            <button type="button"
                                    class="settings-calendar__nav"
                                    data-calendar-next
                                    aria-label="Next month">&rarr;</button>
                        </div>
                        <p class="settings-calendar__meta" data-calendar-meta>Loading saved send sessions…</p>
                        <div class="settings-calendar__weekdays" aria-hidden="true">
                            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                        </div>
                        <div class="settings-calendar__grid"
                             data-calendar-grid
                             role="grid"></div>
                    </div>
                </div>
            </dialog>
            <dialog class="settings-koch-dialog" id="settings-key-lifetime-dialog">
                <form method="dialog" class="settings-koch-dialog__bar">
                    <h2 class="settings-koch-dialog__title" id="settings-key-lifetime-title">
                        Lifetime
                    </h2>
                    <button type="submit"
                            class="settings-koch-dialog__close"
                            aria-label="Close lifetime view">Close</button>
                </form>
                <div class="settings-koch-dialog__body"
                     id="settings-key-lifetime-body"></div>
            </dialog>
            <dialog class="settings-koch-dialog" id="settings-key-dialog">
                <form method="dialog" class="settings-koch-dialog__bar">
                    <h2 class="settings-koch-dialog__title" id="settings-key-dialog-title">
                        Send session
                    </h2>
                    <button type="submit"
                            class="settings-koch-dialog__close"
                            aria-label="Close send session details">Close</button>
                </form>
                <div class="settings-koch-dialog__body" id="settings-key-dialog-body"></div>
                <div class="settings-koch-dialog__nav" aria-label="Send session navigation">
                    <button type="button"
                            class="settings-koch-dialog__nav-button"
                            id="settings-key-dialog-prev"
                            aria-label="Previous send session"
                            title="Previous send session (Left arrow, H, or <)">&lt;</button>
                    <span class="settings-koch-dialog__nav-count"
                          id="settings-key-dialog-count"
                          aria-live="polite">0 of 0</span>
                    <button type="button"
                            class="settings-koch-dialog__nav-button"
                            id="settings-key-dialog-next"
                            aria-label="Next send session"
                            title="Next send session (Right arrow, L, or >)">&gt;</button>
                </div>
            </dialog>
        </section>


    </main>
    <script type="module" src="../js/partials/landing-header.js"></script>
    <script type="module" src="../js/partials/theme-btn.js"></script>
    <script type="module" src="../js/settings-key-table.js"></script>
    <script type="module" src="../js/settings-key-rollup.js"></script>
    <script type="module" src="../js/settings-key-lifetime.js"></script>
    <script type="module" src="../js/settings-calendar.js"></script>
    <script type="module" src="../js/settings-backup.js"></script>
</body>
</html>
