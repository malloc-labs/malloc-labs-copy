<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy 653 — Guided Listening — Symbol Exposure</title>
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/copy-653.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="../js/theme.js"></script>
</head>
<body class="landing-body">
    <button class="theme-btn" id="theme-toggle" aria-label="Switch theme">light</button>
    <main class="landing-shell">
        <header class="landing-header">
            <p class="eyebrow"><a href="index.html" class="back-link">Guided Listening</a></p>
            <h1 class="landing-title">Symbol Exposure</h1>
        </header>
        <hr class="landing-rule">
        <section class="letters-grid" aria-label="Symbol picker">
            <button type="button" class="letter-cell" data-letter="A">A</button>
            <button type="button" class="letter-cell" data-letter="B">B</button>
            <button type="button" class="letter-cell" data-letter="C">C</button>
            <button type="button" class="letter-cell" data-letter="D">D</button>
            <button type="button" class="letter-cell" data-letter="E">E</button>
            <button type="button" class="letter-cell" data-letter="F">F</button>
            <button type="button" class="letter-cell" data-letter="G">G</button>
            <button type="button" class="letter-cell" data-letter="H">H</button>
            <button type="button" class="letter-cell" data-letter="I">I</button>
            <button type="button" class="letter-cell" data-letter="J">J</button>
            <button type="button" class="letter-cell" data-letter="K">K</button>
            <button type="button" class="letter-cell" data-letter="L">L</button>
            <button type="button" class="letter-cell" data-letter="M">M</button>
            <button type="button" class="letter-cell" data-letter="N">N</button>
            <button type="button" class="letter-cell" data-letter="O">O</button>
            <button type="button" class="letter-cell" data-letter="P">P</button>
            <button type="button" class="letter-cell" data-letter="Q">Q</button>
            <button type="button" class="letter-cell" data-letter="R">R</button>
            <button type="button" class="letter-cell" data-letter="S">S</button>
            <button type="button" class="letter-cell" data-letter="T">T</button>
            <button type="button" class="letter-cell" data-letter="U">U</button>
            <button type="button" class="letter-cell" data-letter="V">V</button>
            <button type="button" class="letter-cell" data-letter="W">W</button>
            <button type="button" class="letter-cell" data-letter="X">X</button>
            <button type="button" class="letter-cell" data-letter="Y">Y</button>
            <button type="button" class="letter-cell" data-letter="Z">Z</button>
        </section>
        <section class="letters-grid letters-grid--numerals" aria-label="Numeral picker">
            <button type="button" class="letter-cell" data-letter="0">0</button>
            <button type="button" class="letter-cell" data-letter="1">1</button>
            <button type="button" class="letter-cell" data-letter="2">2</button>
            <button type="button" class="letter-cell" data-letter="3">3</button>
            <button type="button" class="letter-cell" data-letter="4">4</button>
            <button type="button" class="letter-cell" data-letter="5">5</button>
            <button type="button" class="letter-cell" data-letter="6">6</button>
            <button type="button" class="letter-cell" data-letter="7">7</button>
            <button type="button" class="letter-cell" data-letter="8">8</button>
            <button type="button" class="letter-cell" data-letter="9">9</button>
        </section>
    </main>
    <script type="module" src="../js/letters.js"></script>
</body>
</html>
