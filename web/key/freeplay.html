<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy 653 — Key — Freeplay</title>
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/copy-653.css">
    <link rel="stylesheet" href="../css/key-page.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="../js/theme.js"></script>
    <script src="../js/landing-keybinds.js" defer></script>
</head>
<body class="landing-body">
    <copy-theme-btn></copy-theme-btn>
    <main class="landing-shell exercises-shell cadence-shell">
        <copy-header eyebrow="Key" eyebrow-key="K" title="Freeplay" speaker keyer-mode></copy-header>

        <copy-top-menu></copy-top-menu>

        <copy-koch-sequence section-label="Known symbol sequence" read-only></copy-koch-sequence>

        <section class="key-custom-input" aria-label="Custom practice sequence">
            <button type="button" class="key-custom-input__toggle" id="freeplay-custom-toggle" aria-expanded="false" aria-controls="freeplay-custom-body">
                <span class="key-custom-input__label" id="freeplay-custom-label"></span>
                <span class="key-custom-input__arrow" id="freeplay-custom-arrow" aria-hidden="true">▶</span>
            </button>
            <div class="key-custom-input__body" id="freeplay-custom-body" hidden>
                <label class="key-custom-input__field-label" for="freeplay-custom-input">Practice sequence</label>
                <input type="text" class="key-custom-input__field" id="freeplay-custom-input"
                    autocomplete="off" autocapitalize="characters" spellcheck="false"
                    placeholder="e.g. MUM RUM SET" aria-describedby="freeplay-custom-hint">
                <p class="key-custom-input__hint" id="freeplay-custom-hint">Letters, digits, and . , / = ? — space separates words.</p>
            </div>
        </section>

        <copy-sent></copy-sent>

        <copy-rhythm-review
            meta="no input"
            tabs-label="Custom sequence tabs"
            symbols-label="Baseline rhythm for the custom sequence"
        ></copy-rhythm-review>

        <copy-diagnostics></copy-diagnostics>
    </main>
    <script type="module" src="../js/partials/diagnostics.js"></script>
    <script type="module" src="../js/partials/header.js"></script>
    <script type="module" src="../js/partials/koch-sequence.js"></script>
    <script type="module" src="../js/partials/rhythm-review.js"></script>
    <script type="module" src="../js/partials/sent.js"></script>
    <script type="module" src="../js/partials/theme-btn.js"></script>
    <script type="module" src="../js/partials/top-menu.js"></script>
    <script type="module" src="../js/key-timing.js"></script>
    <script type="module" src="../js/freeplay-custom.js"></script>
</body>
</html>
