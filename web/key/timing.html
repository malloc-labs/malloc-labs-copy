<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy 653 — Key — Timing, spacing, and known symbols</title>
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/copy-653.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="../js/theme.js"></script>
</head>
<body class="landing-body">
    <button class="theme-btn" id="theme-toggle" aria-label="Switch theme">light</button>
    <main class="landing-shell exercises-shell">
        <header class="landing-header">
            <p class="eyebrow"><a href="index.html" class="back-link">Key</a></p>
            <h1 class="landing-title">Current symbols <span class="status" data-status="connecting">connecting...</span></h1>
        </header>
        <hr class="landing-rule">

        <section class="koch-sequence" aria-label="Known symbol sequence">
            <p class="sequence-label">Sequence</p>
            <div class="sequence-row sequence-row--read-only" id="sequence-row" role="list"></div>
        </section>

        <section class="key-sent" aria-label="Sent symbols">
            <p class="sequence-label">Sent</p>
            <div class="key-sent-current" aria-live="polite">
                <span class="key-sent-symbol" id="sent-symbol">—</span>
                <span class="key-sent-pattern" id="sent-pattern">—</span>
            </div>
            <ol class="key-sent-history" id="sent-history" aria-label="Recent sent symbols"></ol>
        </section>
    </main>
    <script type="module" src="../js/key-timing.js"></script>
</body>
</html>
