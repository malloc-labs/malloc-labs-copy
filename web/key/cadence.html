<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy 653 — Key — Cadence</title>
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/copy-653.css">
    <link rel="stylesheet" href="../css/key-page.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="../js/theme.js"></script>
</head>
<body class="landing-body">
    <copy-theme-btn></copy-theme-btn>
    <main class="landing-shell exercises-shell cadence-shell">
        <copy-header eyebrow="Key" title="Cadence" speaker></copy-header>

        <copy-top-menu show-new></copy-top-menu>

        <copy-koch-sequence section-label="Known symbol sequence" collapsible read-only></copy-koch-sequence>

        <section class="key-copy" aria-label="Copy">
            <div class="key-copy-target">
                <div class="key-copy-target-labels">
                    <p class="sequence-label">Copy</p>
                    <span class="key-copy-target-label" id="copy-position-label">Exercise sequence:</span>
                </div>
                <span class="key-copy-symbol" id="copy-symbol" aria-live="polite">—</span>
            </div>
            <p class="key-copy-imi" id="copy-imi" aria-live="polite" hidden>IMI - Repeat; Say Again</p>
            <button type="button" class="key-copy-history__toggle" id="copy-history-toggle" aria-expanded="false" aria-controls="copy-history">
                <span class="key-copy-history__label" id="copy-history-label"></span>
                <span class="key-copy-history__arrow" id="copy-history-arrow" aria-hidden="true">▶</span>
            </button>
            <ol class="key-copy-history" id="copy-history" aria-label="Copy history" hidden></ol>
        </section>

        <copy-sent></copy-sent>

        <copy-rhythm-review
            meta="no symbols"
            tabs-label="Exercise review tabs"
            symbols-label="Baseline rhythm for the active exercise"
        ></copy-rhythm-review>

        <copy-diagnostics></copy-diagnostics>
    </main>
    <script type="module" src="../js/partials/diagnostics.js"></script>
    <script type="module" src="../js/partials/header.js"></script>
    <script type="module" src="../js/partials/koch-sequence.js"></script>
    <script type="module" src="../js/partials/rhythm-review.js"></script>
    <script type="module" src="../js/partials/sent.js"></script>
    <script type="module" src="../js/partials/theme-btn.js"></script>
    <script type="module" src="../js/partials/top-menu.js"></script>
    <script type="module" src="../js/key-timing.js"></script>
</body>
</html>
