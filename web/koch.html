<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy — Koch Method</title>
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/copy-653.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="js/theme.js"></script>
</head>
<body>

    <button class="theme-btn" id="theme-toggle" aria-label="Switch theme">light</button>

    <div class="page">

        <header class="masthead">
            <p class="eyebrow"><a href="index.html" class="back-link">Copy</a></p>
            <h1>Koch Method <span class="status" data-status="connecting">connecting…</span></h1>
        </header>

        <main>

        <section class="claim" aria-label="Claimed symbols">
            <p class="claim-line">
                <span class="claim-label">Claimed</span>
                <span class="claim-symbols" id="claimed-symbols">—</span>
                <span class="claim-suggested" id="claim-suggested" hidden>
                    <span class="claim-label">suggested next</span>
                    <span id="suggested-next">—</span>
                </span>
            </p>
            <button type="button" id="claim-button" hidden>Claim</button>
        </section>

        <section class="controls" aria-label="Listening controls">
            <button type="button" id="start" disabled>Start</button>
            <button type="button" id="stop" disabled>Stop</button>
        </section>

        <p class="primed" id="primed">Primed: —</p>

        <section class="timeline" aria-live="polite" aria-label="Truth">
            <ol id="events"></ol>
        </section>
        </main>

    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
