<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy 653 — Koch Method — Exercises</title>
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/copy-653.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="../js/theme.js"></script>
</head>
<body class="landing-body">
    <button class="theme-btn" id="theme-toggle" aria-label="Switch theme">light</button>
    <main class="landing-shell exercises-shell">
        <header class="landing-header">
            <p class="eyebrow"><a href="index.html" class="back-link">Koch Method</a></p>
            <h1 class="landing-title">Exercises <span class="status" data-status="connecting">connecting…</span></h1>
        </header>
        <hr class="landing-rule">

        <!--
            Koch sequence row — full 41-symbol sequence rendered by JS.
            Each token is a <button> with data-symbol and data-state:
              claimed   — in the learner's active set
              next      — first unclaimed symbol (gentle nudge)
              available — not yet claimed
            K and M are the permanent starting pair; they cannot be unclaimed.
        -->
        <section class="koch-sequence" aria-label="Koch symbol sequence">
            <p class="sequence-label">Sequence</p>
            <div class="sequence-row" id="sequence-row" role="list"></div>
        </section>

        <section class="controls" aria-label="Listening controls">
            <button type="button" id="start" disabled>Start</button>
            <button type="button" id="stop" disabled>Stop</button>
            <button type="button" id="clear" disabled>Clear</button>
        </section>
        <p class="primed" id="primed">Primed: —</p>
        <section class="timeline" aria-label="Truth">
            <button type="button"
                    class="timeline-toggle"
                    aria-expanded="false"
                    aria-disabled="true"
                    aria-controls="timeline-body">
                <span class="timeline-arrow">▶</span>
                <span class="timeline-meta">—</span>
            </button>
            <div class="timeline-body" id="timeline-body" aria-live="polite">
                <ol id="events"></ol>
            </div>
        </section>
    </main>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
