<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy 653 — Word Detection</title>
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/copy-653.css">
    <!-- Runs blocking before CSS paint to prevent theme flash -->
    <script src="../js/theme.js"></script>
</head>
<body class="landing-body">
    <copy-theme-btn></copy-theme-btn>
    <main class="landing-shell exercises-shell">
        <copy-header eyebrow="Koch Method" title="Word Detection"></copy-header>
        <p class="landing-desc">Known symbols within short English words.</p>

        <copy-koch-sequence section-label="Focus symbols" row-id="focus-row" label="Listening for"></copy-koch-sequence>

        <section class="controls" aria-label="Listening controls">
            <button type="button" id="start" disabled>Start</button>
            <button type="button" id="stop" disabled>Stop</button>
            <button type="button" id="clear" disabled>Clear</button>
        </section>
        <p class="primed" id="primed">Primed: —</p>

        <section class="timeline" aria-label="Truth">
            <button type="button"
                    class="timeline-toggle"
                    aria-expanded="false"
                    aria-disabled="true"
                    aria-controls="timeline-body">
                <span class="timeline-arrow">▶</span>
                <span class="timeline-meta">—</span>
            </button>
            <div class="timeline-body" id="timeline-body" aria-live="polite">
                <ol id="events"></ol>
            </div>
        </section>
    </main>
    <script type="module" src="../js/partials/header.js"></script>
    <script type="module" src="../js/partials/koch-sequence.js"></script>
    <script type="module" src="../js/partials/theme-btn.js"></script>
    <script type="module" src="../js/word-detection.js"></script>
</body>
</html>
